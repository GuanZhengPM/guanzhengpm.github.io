<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="关于Guanzheng's Blog。" />
    <meta name="theme-color" content="#f7f6f1" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("guanzheng-theme");
          const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#181918" : "#f7f6f1";
        } catch {}
      })();
    </script>
    <title>关于·Guanzheng's Blog</title>
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="./index.html" aria-label="Guanzheng's Blog首页">
          <span>Guanzheng写字的地方✍️</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="https://github.com/GuanZhengPM" target="_blank" rel="noreferrer">GitHub ↗</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式" aria-pressed="false">◐</button>
        </nav>
      </div>
    </header>

    <main id="main-content" class="about-shell" tabindex="-1">
      <p class="eyebrow">关于这个地方</p>
      <h1>不是答案库，<br />是判断的工作台。</h1>
      <div class="about-copy">
        <p>这里记录AI、产品、职业与学习里真正遇到的问题：哪些判断被验证，哪些经验已经过期，哪些事情值得持续投入。</p>
        <p>写作是为了把模糊的感觉变成可讨论、可复盘的表达。每月更新一次，也接受偶尔跳票。</p>
        <p>如果你对某篇文章有不同看法，欢迎通过GitHub找到我。</p>
      </div>
      <a class="text-link" href="https://github.com/GuanZhengPM" target="_blank" rel="noreferrer">访问GitHub→</a>
    </main>

    <footer class="site-footer">
      <p>© <span data-current-year></span> Guanzheng</p>
    </footer>
    <script type="module" src="./app.js?v=4"></script>
  </body>
</html>
